apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-compose-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-compose-backend
  template:
    metadata:
      labels:
        app: docker-compose-backend
    spec:
      containers:
        - name: backend
          image: docker-compose-app-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: docker-compose-backend
spec:
  selector:
    app: docker-compose-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-compose-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-compose-web
  template:
    metadata:
      labels:
        app: docker-compose-web
    spec:
      containers:
        - name: web
          image: docker-compose-app-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: docker-compose-web
spec:
  type: NodePort
  selector:
    app: docker-compose-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
